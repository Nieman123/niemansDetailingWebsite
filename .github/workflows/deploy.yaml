name: Deploy production

# Production deploys only from main. See docs/production-setup.md for every secret and setting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shared with the manual blog workflow so two production releases never overlap.
concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://niemansdetailing.com
    env:
      FIREBASE_PROJECT_ID: niemansdetailing
      FIREBASE_CLI_VERSION: 15.32.0
      HOSTING_ORIGIN: ${{ vars.HOSTING_ORIGIN || secrets.HOSTING_ORIGIN || 'https://niemansdetailing.com' }}
      # Appointments stay off in production until this environment variable is set to true. When on,
      # production takes live Stripe payments and emails customers (APPOINTMENTS_MODE=live).
      ENABLE_APPOINTMENTS: ${{ vars.ENABLE_APPOINTMENTS == 'true' && 'true' || 'false' }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Check production settings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIEMANSDETAILING }}
        run: |
          missing=()
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing+=(FIREBASE_SERVICE_ACCOUNT_NIEMANSDETAILING)
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing+=(TELEGRAM_BOT_TOKEN)
          [ -n "$TELEGRAM_CHAT_ID" ] || missing+=(TELEGRAM_CHAT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Add these secrets to the production environment (or the repository): ${missing[*]}"
            exit 1
          fi
          case "$HOSTING_ORIGIN" in
            https://*[!/]) ;;
            *) echo "::error::HOSTING_ORIGIN must be an https origin without a trailing slash."; exit 1 ;;
          esac

      - name: Install Functions dependencies and build
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install site dependencies and run unit tests
        run: |
          npm ci --no-audit --no-fund
          node scripts/test-addon-notifications.cjs
          node scripts/test-booking-notifications.cjs
          node scripts/test-ceramic-notifications.cjs
          node scripts/test-appointment-calendar.mjs
          node scripts/test-appointment-integrations.mjs
          node scripts/test-deposit-waiver.mjs
          node scripts/test-invoices.mjs
          node scripts/test-business-report.mjs

      - name: Install Firebase CLI
        run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test appointment API against Firebase emulators
        run: |
          emulator_env=functions/.env.local
          trap 'rm -f "$emulator_env"' EXIT
          printf '%s\n' 'APPOINTMENT_INTEGRATIONS_PROJECT=demo-detailing-prod' 'HOSTING_ORIGIN=https://demo-detailing-prod.web.app' > "$emulator_env"
          firebase emulators:exec --non-interactive --project demo-detailing-prod \
            --only auth,firestore,functions,hosting 'node scripts/test-appointments-api.mjs && node scripts/test-invoices-api.mjs'

      # tools/build-images.mjs reuses a variant when its source bytes and settings are unchanged,
      # so restoring an older cache only rebuilds the images that changed since then.
      - name: Restore optimized images
        uses: actions/cache@v4
        with:
          path: public/images
          key: images-${{ hashFiles('tools/build-images.mjs', 'assets/images/**') }}
          restore-keys: images-

      - name: Build site
        run: |
          npm run images:copy
          npm run build:images
          npm run build:blog
          npm run img:rewire

      - name: Build appointments bundle
        if: env.ENABLE_APPOINTMENTS == 'true'
        run: |
          node scripts/prepare-staging.mjs --production
          echo "FIREBASE_DEPLOY_CONFIG=firebase.production.generated.json" >> "$GITHUB_ENV"

      - name: Lighthouse CI (report only)
        run: npm run lhci
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Authenticate to the production project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIEMANSDETAILING }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          let credentials;
          try {
            credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_NIEMANSDETAILING must be the JSON key of the deploy service account.');
          }
          if (credentials?.type !== 'service_account' ||
              credentials.project_id !== process.env.FIREBASE_PROJECT_ID ||
              !credentials.client_email || !credentials.private_key) {
            throw new Error('The deployment credential must belong to the production Firebase project.');
          }
          const credentialsPath = join(process.env.RUNNER_TEMP, 'firebase-production-service-account.json');
          writeFileSync(credentialsPath, JSON.stringify(credentials), { mode: 0o600 });
          writeFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialsPath}\n`, { flag: 'a' });
          NODE

      - name: Write Functions environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          {
            printf 'HOSTING_ORIGIN=%s\n' "$HOSTING_ORIGIN"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'ENABLE_APPOINTMENTS=%s\n' "$ENABLE_APPOINTMENTS"
            if [ "$ENABLE_APPOINTMENTS" = true ]; then
              printf 'APPOINTMENT_INTEGRATIONS_PROJECT=%s\n' "$FIREBASE_PROJECT_ID"
              printf 'APPOINTMENTS_MODE=live\n'
            fi
          } > functions/.env

      - name: Deploy Functions and Firestore rules/indexes
        run: |
          targets=functions:api,functions:notifyLeadAddonUpdate,functions:notifyAppointmentBooked,firestore:rules,firestore:indexes
          # The reconciliation job runs every 5 minutes, and job photos need Storage rules, so both
          # deploy only once appointments are on.
          if [ "$ENABLE_APPOINTMENTS" = true ]; then targets="$targets,functions:appointmentMaintenance,storage"; fi
          # --force accepts the retry policy on notifyLeadAddonUpdate, which the CLI otherwise refuses
          # without a prompt. With --only it never deletes functions outside the listed targets.
          firebase deploy --non-interactive --force --config "${FIREBASE_DEPLOY_CONFIG:-firebase.json}" --project "$FIREBASE_PROJECT_ID" --only "$targets"

      # Job photo thumbnails download with getBlob(), which needs the bucket's CORS setting.
      - name: Apply Storage CORS
        if: env.ENABLE_APPOINTMENTS == 'true'
        run: node scripts/apply-storage-cors.mjs "$FIREBASE_PROJECT_ID"

      - name: Deploy Hosting
        run: firebase deploy --non-interactive --config "${FIREBASE_DEPLOY_CONFIG:-firebase.json}" --project "$FIREBASE_PROJECT_ID" --only hosting

      - name: Smoke test production
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const origin = process.env.HOSTING_ORIGIN;
          const request = (path, options) => fetch(`${origin}${path}`, {
            ...options, redirect: 'manual', signal: AbortSignal.timeout(30_000),
          });
          for (const path of ['/', '/quote', '/schedule', '/blog', '/admin']) {
            const page = await request(path);
            assert.equal(page.status, 200, path);
            assert.match(page.headers.get('content-type') ?? '', /html/, path);
          }
          const config = await request('/scripts/firebase-config.mjs');
          assert.match(config.headers.get('content-type') ?? '', /javascript/, 'firebase-config.mjs should be deployed');
          assert.ok((await config.text()).includes(`"${process.env.FIREBASE_PROJECT_ID}"`), 'Production Firebase config');

          const lead = await request('/api/createLead', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Origin: origin }, body: '{}',
          });
          assert.equal(lead.status, 400, 'createLead should reject an empty quote');
          assert.equal(lead.headers.get('access-control-allow-origin'), origin, 'HOSTING_ORIGIN must match the site origin');
          if (process.env.ENABLE_APPOINTMENTS === 'true') {
            const schedule = await (await request('/schedule')).text();
            assert.ok(!schedule.includes('calendar.google.com/calendar/appointments'), '/schedule should be the first-party booking page');
            const options = await request('/api/appointments/booking-options', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Origin: origin }, body: '{}',
            });
            assert.equal(options.status, 200, 'Appointment API should be enabled');
            const webhook = await request('/api/appointments/stripe-webhook', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
            });
            if (webhook.status === 503) console.warn('::warning::The webhook could not load a live Stripe configuration (APPOINTMENT_STRIPE_CONFIG).');
            else assert.equal(webhook.status, 400, 'Webhook should reject an unsigned request');
          }
          console.log(`Production smoke checks passed at ${origin}`);
          NODE
