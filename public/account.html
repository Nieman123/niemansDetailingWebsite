<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>My appointments | Nieman's Detailing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles/brand.css?v=20261120">
  <link rel="stylesheet" href="/quote.css">
  <link rel="stylesheet" href="/styles/appointments.css">
<link rel="stylesheet" href="/styles/booking.css"></head>
<body class="quote-page appointment-app appointment-customer">
<header class="customer-bar"><a href="/" aria-label="Nieman’s Detailing home"><img src="/images/ND-logo-white-transparentbg-horizontal-300.webp" alt="Nieman’s Detailing" width="300" height="30"></a>
<nav aria-label="Help"><a href="sms:+18282733894"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Text Nieman</a><a class="hide-sm" href="/schedule">Book a detail</a></nav></header>
  <main class="wrap">
    <h1>My appointments</h1>
    <p id="account-status" role="status">Loading…</p>
    <section id="account-sign-in" class="panel" hidden>
      <form id="email-link">
        <label class="field"><span>Appointment email</span><input name="email" type="email" required autocomplete="email"></label>
        <button type="submit" class="btn primary">Email me a sign-in link</button>
        <button type="button" class="btn secondary" id="google-sign-in">Sign in with Google</button>
      </form>
      <details>
        <summary>Sign in with a password</summary>
        <form id="password-sign-in">
          <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
          <label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
          <button type="submit" class="btn secondary">Sign in</button>
          <button type="button" class="btn secondary" id="reset-password">Send reset email</button>
        </form>
      </details>
    </section>
    <section id="account-dashboard" class="panel" hidden>
      <div class="appointment-actions"><a class="btn primary" href="/schedule">Book another detail</a><button class="quiet" id="account-sign-out" type="button">Sign out</button></div>
      <div id="my-appointments"></div>
      <details><summary>Set or update a password</summary>
        <form id="set-password">
          <label class="field"><span>New password</span><input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
          <button type="submit" class="btn secondary">Save password</button>
        </form>
      </details>
    </section>
  </main>
  <script type="module" src="/scripts/appointment-account.mjs"></script>
</body>
</html>
